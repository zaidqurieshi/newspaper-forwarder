name: Newspaper Forwarder

on:
  # Run every hour at minute 17 (avoids the top of the hour crowd).
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Prevent overlapping runs from clobbering each other's database
# updates when cron schedules overlap or a run is slow.
concurrency:
  group: newspaper-forwarder
  cancel-in-progress: false

jobs:
  forward-newspapers:
    runs-on: ubuntu-latest
    # Give the job up to 10 minutes so a large backlog can drain.
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Forward newspapers
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
        run: |
          python -u forward_papers.py

      - name: Save forwarding database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add forwarded_messages.json

          if git diff --cached --quiet; then
            echo "No database changes."
          else
            git commit -m "Update forwarding database"
            git push
          fi